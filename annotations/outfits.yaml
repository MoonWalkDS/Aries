# Trang phục của từng người (python main.py enrich merge điền sẵn cho tên mới, từ câu trả lời VLM gặp nhiều nhất).
# Sửa tự do. Điền stripe_direction (horizontal/vertical), top_color_upper / top_color_lower (màu nửa trên / nửa
