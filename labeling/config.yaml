# Cấu hình pipeline gán nhãn Castle5000.
# Đường dẫn tương đối tính từ thư mục chứa file này (labeling/). Bố cục: ../dataset (ảnh nguồn),
# labels/ (định nghĩa nhãn), annotations/ (nhãn người duyệt), work/ (máy sinh), ../exports (sản phẩm).
# Ghi đè khi chạy trên Kaggle/Colab bằng biến môi trường:
#   LABELING_INPUT_IMAGES=/kaggle/input/<dataset>/images
#   LABELING_OUTPUT_ROOT=/kaggle/working/labeling_out   (chứa output_crops/, output_jsons/, logs/, exports/)
#   LABELING_IDENTITY_GALLERY=/kaggle/working/identity_gallery
# hoặc bằng tham số CLI --input-images / --output-root.

paths:
  input_images: ../dataset/images    # 5000 ảnh gốc, đọc trực tiếp, không sao chép
  output_crops: work/output_crops
  output_jsons: annotations        # nhãn người duyệt + trạng thái vòng lặp adl_*/; key giữ tên cũ cho gói Kaggle
  logs: work/logs
  exports: ../exports               # castle_dataset.jsonl + *.csv do `enrich merge` xuất
  identity_gallery: work/identity_gallery # identity_gallery/<Tên người>/*.jpg
  model_cache: null                  # thư mục cache Hugging Face; null = mặc định

thresholds:
  tau_face: 0.65                     # cosine >= tau_face thì gán tên từ gallery
  pad_margin: 0.15                   # nới box 15% mỗi phía trước khi crop

detector:
  # Bản đã chuyển đổi cho lớp gốc của transformers (>= 4.56). Bản microsoft/Florence-2-large
  # dùng mã remote và không chạy được trên transformers 5.x.
  model_id: florence-community/Florence-2-large
  device: auto                       # auto | cuda | cpu
  dtype: float16                     # float16 | float32 (cpu luôn dùng float32)
  num_beams: 3
  max_new_tokens: 1024
  # Các lớp cho phát hiện từ vựng mở, ngoài tác vụ <OD> mặc định.
  grounding_classes:
    - person
    - refrigerator
    - sink
    - stove
    - microwave
    - kettle
    - table
    - chair
    - cabinet
    - countertop
    - door
    - window
    - trash can
    - laptop
    - phone
    - cup
    - bowl
    - plate
    - bottle
    - pot
    - pan
  open_vocab_mode: grounding         # grounding: 1 lượt cho mọi lớp | per_class: 1 lượt mỗi lớp (chậm, kỹ hơn)
  # Nhãn Florence được quy về "person".
  person_aliases: [person, people, man, woman, boy, girl, human, lady, guy]
  min_box_area_frac: 0.0015          # bỏ box nhỏ hơn 0.15% diện tích ảnh
  max_box_area_frac: 0.90            # bỏ box gần phủ kín ảnh (thường là lỗi grounding)
  nms_iou: 0.60                      # gộp box cùng nhãn trùng nhau
  save_object_crops: true            # false: chỉ lưu crop người

reid:
  model_name: buffalo_l              # gói model InsightFace (ArcFace 512 chiều)
  det_size: [1280, 1280]             # lớn vì mặt nhỏ trong khung 1280x720
  min_det_score: 0.50                # bỏ mặt phát hiện yếu
  gallery_refs_per_identity: 5
  cluster:
    min_det_score: 0.60
    min_face_px: 24                  # cạnh ngắn tối thiểu của box mặt
    eps: 0.50                        # khoảng cách cosine tối đa giữa hai mặt cùng cụm (DBSCAN)
    min_samples: 5
    max_clusters: 40                 # chỉ xuất contact sheet cho N cụm lớn nhất
    faces_per_sheet: 24

vlm:
  backend: qwen_local                # qwen_local | api | openai
  max_persons_per_image: 8           # người lớn nhất được mô tả riêng; phần còn lại chỉ có box
  crop_min_short_side: 448           # phóng to crop người tới cạnh ngắn tối thiểu này
  crop_max_long_side: 1024
  global_max_long_side: 1280
  max_new_tokens_entity: 512
  max_new_tokens_scene: 1200
  retries: 1                         # số lần hỏi lại khi JSON không hợp lệ
  empty_cache_every: 10              # gọi torch.cuda.empty_cache() sau mỗi N ảnh
  qwen_local:
    model_id: Qwen/Qwen2.5-VL-7B-Instruct
    dtype: float16                   # bfloat16 | float16 (T4 không có bfloat16 gốc)
    quantization: none               # none | 4bit
    min_pixels: 200704               # 256 * 28 * 28
    max_pixels: 1003520              # 1280 * 28 * 28
  api:
    provider: anthropic
    model_id: claude-opus-5-5
    effort: medium                   # low | medium | high | xhigh | max
    max_tokens: 16000                # gồm cả phần suy luận của model
    max_retries: 4
    timeout_s: 300
    refusal_fallback: true           # dùng fallback phía server khi model từ chối
  openai:
    model_id: gpt-5.4-mini           # model có thị giác; đổi theo tài khoản của bạn
    reasoning_effort: null           # null = mặc định của model | low | medium | high
    max_tokens: 8000                 # gồm cả phần suy luận của model
    image_detail: auto               # low | high | auto
    max_retries: 4
    timeout_s: 300

pilot:
  num_images: 30
  submissions_log: ../dres_auto/runtime/submissions.log  # lấy ảnh đáp án các đề đã nộp đúng
  item_prefix: day1_Kitchen_
  # Mỗi mục là một lượt chạy; các khoá ngoài name/backend ghi đè vào vlm.<backend>.
  models:
    - name: qwen7b
      backend: qwen_local
    - name: claude-opus-5-5
      backend: api

adl:
  # Gán nhãn hoạt động cấp ảnh theo LSC-ADL (ref/2504.02060v1.pdf). Xem modules/adl.py.
  labels_file: labels/adl_labels.yaml       # các lớp + câu mô tả
  raw_labels_file: labels/adl_raw_labels.yaml  # nhãn thô từ các bộ dữ liệu ADL khác
  # Mô tả góc máy, chèn vào mọi prompt của bước chọn nhãn và sinh câu mô tả.
  viewpoint: a fixed wide-angle ceiling camera looking down at a shared kitchen where several people cook and eat together
  label_selection:                   # mục 3.2 của bài báo + Decompose-Expand
    caption_backend: openai          # VLM viết caption: openai | api | qwen_local
    llm_backend: openai              # LLM đề xuất nhãn, xếp nhóm, sinh câu mô tả
    num_groups: 20                   # số nhóm thời gian tối đa (bài báo: 20 ngày; ở đây mỗi giờ một nhóm)
    images_per_group: 15             # số ảnh mỗi nhóm, rải đều theo thời gian
    seed: 0
    caption_max_long_side: 1280
    caption_max_new_tokens: 200
    descriptions_per_class: 7
    retries: 1                       # số lần hỏi lại khi JSON không hợp lệ
    groups: [General, Transport, Food & Beverage, Entertainment, Work, House Chores, Shopping, Personal Hygiene]
  embeddings: work/adl/embeddings.npy  # do `adl embed` dựng, mỗi dòng một ảnh
  ids: work/adl/ids.json             # tên file tương ứng từng dòng
  clip:                              # model open_clip cho cả ảnh lẫn câu mô tả; đổi thì chạy lại `adl embed`
    model: ViT-SO400M-16-SigLIP2-384
    pretrained: webli
  embed:
    out_dir: work/adl
    device: auto                     # auto | cuda | cpu
    batch_size: 16
    workers: 4
    focus:                           # vector thứ hai từ vùng có người, tìm bằng trừ nền (camera cố định)
      enabled: true
      size: [160, 90]                # cỡ ảnh xám dùng để trừ nền
      threshold: 25                  # chênh lệch mức xám tối thiểu để coi pixel là đã đổi
      min_fraction: 0.004            # dưới tỉ lệ diện tích này thì coi như không có người
      pad: 0.15                      # nới hộp focus mỗi phía
      weight: 1.0                    # vector cuối = toàn cảnh + weight * focus
  center: true                       # trừ vector trung bình trước khi so ảnh-ảnh (bỏ thành phần nền chung)
  empty:                             # ảnh không có chuyển động -> lớp này, không cần CLIP
    class: empty kitchen             # null = tắt
    max_motion: 0.002                # tỉ lệ diện tích chuyển động tối đa
  seed:
    per_description: 8               # số ảnh lấy cho mỗi câu mô tả
    max_per_class: 40                # trần ảnh hạt giống mỗi lớp
    min_similarity: 0.05             # cosine text-ảnh tối thiểu (thang SigLIP2: 0.05-0.2); 0 = không lọc
  suggest:
    tau_sim: 0.65                    # cosine ảnh-centroid tối thiểu (sau khi center) để gợi ý
    min_margin: 0.0                  # cách lớp khác tốt nhất tối thiểu; > 0 loại ảnh nằm giữa hai lớp
    max_per_round: 500               # chỉ giữ N gợi ý điểm cao nhất mỗi vòng; null = tất cả
  cluster:
    min_cluster_size: 5              # HDBSCAN trong từng lớp
    min_samples: 2
  review:
    thumbs_dir: ../dataset/thumbs          # ảnh nhỏ cho trang duyệt HTML; null hoặc thiếu file thì dùng ảnh gốc
  vlm_review:                        # VLM làm người duyệt vòng đầu (adl vlm-review, pipeline --steps vlm)
    backend: qwen_local              # qwen_local | api | openai
    question: the main activity happening in this scene
    max_long_side: 768               # thu ảnh trước khi đưa cho VLM
    max_new_tokens: 24               # câu trả lời chỉ là {"choice": N}
    retries: 1                       # hỏi lại khi không đọc được lựa chọn

# Làm giàu theo tầng (modules/enrich.py): crop người và crop vùng cố định, mã hoá bằng adl.clip.
enrich:
  out_dir: work/enrich
  rois_file: labels/rois.yaml               # các vùng cố định + trạng thái của từng vùng
  device: auto
  batch_size: 16
  workers: 4
  shard_size: 250                    # lưu kết quả sau mỗi N ảnh; chạy lại sẽ tiếp tục từ đó
  crop_thumb_long_side: 384          # cỡ ảnh crop lưu cho trang duyệt
  person:
    model_id: PekingU/rtdetr_r50vd   # RT-DETR (COCO), lấy lớp person
    threshold: 0.45                  # điểm tối thiểu của một box người
    nms_iou: 0.70                    # bỏ box trùng nhau
    min_area_frac: 0.004             # bỏ box nhỏ hơn 0.4% khung hình
    max_per_image: 10
    pad_margin: 0.10                 # nới box trước khi cắt
    min_zone_overlap: 0.35           # tỉ lệ box người phải nằm trong zone để coi là "đang ở" vùng đó
  objects:                           # `enrich objects`: cùng model RT-DETR, giữ các lớp COCO khác người
    threshold: 0.40
    nms_iou: 0.50                    # gộp box cùng lớp trùng nhau
    max_per_image: 40
    # Đồ cố định của bếp có ở mọi ảnh: không mang thông tin, chỉ làm rối.
    # Tên lớp theo model PekingU/rtdetr_r50vd (kiểu VOC: diningtable, sofa, tvmonitor, pottedplant).
    exclude: [person, diningtable, chair, sofa, bed, refrigerator, oven, sink, tvmonitor, toilet, pottedplant]
    # `enrich objects --owl`: OWLv2 tìm theo tên các vật COCO không có. Đã bỏ cup/knife/bottle (RT-DETR lo).
    # Thử trên 4 ảnh: nồi trên bếp 0.26–0.55, khăn 0.54; dưới khoảng 0.27 phần lớn là nhầm (cuộn giấy -> cốc).
    # Bỏ box nằm cùng một chỗ (IoU >= iou) trong ít nhất min_fraction số ảnh: đồ cố định bị nhận nhầm
    # (cửa lò -> khăn, mép cửa -> máy nướng bánh) và đồ nằm yên cả ngày (dứa, ấm, chai nước cạnh thùng rác).
    # Lọc lúc `enrich merge`; objects.json / objects_owl.json giữ nguyên. Danh sách chỗ bị bỏ: work/enrich/objects_static.json.
    static: {iou: 0.50, min_fraction: 0.15}
    owl:
      model_id: google/owlv2-base-patch16-ensemble
      threshold: 0.27
      nms_iou: 0.50
      max_per_image: 30
      queries: [cooking pot, frying pan, kettle, cutting board, tea towel, plate, toaster, baking tray, food container, pineapple]
  identity:                          # `enrich identities`: gom crop người theo ngoại hình để đặt tên
    method: name                     # name: theo tên người duyệt đặt + mô hình | outfit: theo trang phục VLM mô tả (gộp nhầm nhiều) | siglip: KMeans
    uncertain_clusters: 20           # name: crop mô hình chưa chắc (prob < min_prob) gom thành N cụm "chưa chắc"
    min_group: 15                    # outfit: khoá trang phục cần ít nhất N crop mới thành cụm riêng
    clusters: 40                     # siglip: cố ý nhiều hơn số người thật; nhiều cụm cùng tên = cùng một người
    pca_dims: 64
    min_box_height: 160              # chỉ crop đủ lớn dùng để học cụm; crop nhỏ vẫn được xếp vào cụm gần nhất
    examples: 12                     # số crop tiêu biểu mỗi cụm cho viewer
    seed: 0
    # Học tên từ crop đã đặt tên (logistic regression trên SigLIP), chạy trong `enrich merge`.
    min_examples: 20                 # một tên cần ít nhất N crop có tên mới được học
    c: 10.0                          # 1.0 -> 10.0: đúng 0,908 -> 0,943 khi bỏ hẳn từng giờ ra kiểm tra (7.272 crop tên tay, 2026-11-19)
    min_prob: 0.60                   # dưới ngưỡng này giữ tên của cụm (hoặc để trống) thay vì tên mô hình đoán
    track: {max_gap: 21, min_iou: 0.5, min_cos: 0.85}   # crop dưới min_prob lấy tên theo vệt qua ảnh liền kề; null = tắt
  actions:                           # `enrich actions`: gộp VLM + SigLIP + vùng + trạng thái vùng + câu mô tả của thầy
    teacher_metadata: ../dataset/raw/teacher_metadata.csv
    min_human: 50                    # cần ít nhất N nhãn hành động người duyệt mới học
    override_gap: 2.0                # merge thay nhãn máy khi điểm gộp hơn nhãn VLM > N. Đo (145 nhãn): đổi 56, gộp đúng 25 / VLM đúng 3; tổng 51,0% (VLM 35,9%)
  attrs:                             # `pipeline --steps attrs`: VLM mô tả ngoại hình từng crop người
    min_box_height: 160              # px ảnh gốc; người thấp hơn (xa, bị cắt) bỏ qua. 160 -> khoảng 9.000 / 12.819 crop
    max_long_side: 448
    max_new_tokens: 160
    retries: 1
  roi:
    size: [320, 180]                 # cỡ ảnh xám dùng để so với nền
    threshold: 25                    # chênh lệch mức xám để coi pixel là đã đổi
    min_changed: 0.10                # tỉ lệ pixel của vùng phải đổi thì mới cắt và mã hoá vùng đó

# Ghi đè mục `adl` khi chạy `adl ... --profile TÊN`. Trạng thái nằm ở annotations/adl_<TÊN>/.
adl_profiles:
  people:                            # đơn vị = một người (crop). Nhãn = hành động của người đó.
    labels_file: labels/adl_people_labels.yaml
    embeddings: work/enrich/people/embeddings.npy
    ids: work/enrich/people/ids.json
    viewpoint: a crop of one person seen from a ceiling camera in a shared kitchen
    vlm_review: {question: what this person is doing}
    empty: {class: null}
    seed: {per_description: 10, max_per_class: 60, min_similarity: 0.05}
    suggest: {tau_sim: 0.60, max_per_round: 600}
    review: {images_dir: work/enrich/people/crops, thumbs_dir: null}
  roi:                               # khuôn cho `--profile roi-<tên vùng>`; {roi} = tên vùng trong rois.yaml
    labels_file: "work/enrich/rois/{roi}/labels.yaml"
    embeddings: "work/enrich/rois/{roi}/embeddings.npy"
    ids: "work/enrich/rois/{roi}/ids.json"
    viewpoint: "a crop of one fixed region ({roi}) of a shared kitchen seen from a ceiling camera"
    vlm_review: {question: the current state of this region}
    empty: {class: null}
    seed: {per_description: 8, max_per_class: 40, min_similarity: 0.03}
    suggest: {tau_sim: 0.55, max_per_round: 400}
    cluster: {min_cluster_size: 4, min_samples: 2}
    review: {images_dir: "work/enrich/rois/{roi}/crops", thumbs_dir: null}

label_studio:
  project_title: Castle5000 annotation review
  # Tiền tố URL ảnh trong Label Studio. Mặc định dùng Local Storage với
  # LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT trỏ tới labeling/data.
  image_url_prefix: "/data/local-files/?d=images/"
  extra_identities: []               # tên bổ sung cho ô chọn danh tính (ngoài gallery)
