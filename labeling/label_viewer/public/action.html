<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gán nhanh hành động</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <style>
    .q-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; padding: 12px 16px; height: calc(100vh - 56px); }
    @media (max-width: 860px) { .q-wrap { grid-template-columns: 1fr; height: auto; } }
    .q-stage { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .q-stage canvas { width: 100%; height: 100%; min-height: 320px; object-fit: contain; background: #111; border-radius: 8px; }
    .q-info { display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
    .q-guess { font-weight: 600; }
    .q-keys { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .q-key { display: flex; gap: 10px; align-items: center; padding: 6px 10px; border: 1px solid var(--line, #d9d9d4); border-radius: 6px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .q-key kbd { min-width: 22px; text-align: center; font-weight: 700; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
    .q-key.guess { outline: 2px solid #e0a800; }
    .q-key.flash { background: #1a7f4b; color: #fff; }
    .q-key.danger kbd { color: #c0392b; }
    .q-key.ok kbd { color: #1a7f4b; }
    .q-guess { font-size: 1.15em; }
    /* thẻ nhãn cần so: chữ lớn, đặt ngay trên ảnh để mắt không phải rời khỏi ảnh lâu */
    .a-card { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; }
    .a-box { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 8px 16px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); min-width: 180px; }
    .a-box small { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .a-box b { font-size: 28px; line-height: 1.15; color: var(--strong); }
    .a-box.from b { font-size: 22px; color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
    .a-box.to { border-color: var(--yellow); background: var(--yellow-bg); }
    .a-box.none b { color: var(--muted); }
    .a-arrow { align-self: center; font-size: 28px; color: var(--muted); }
    .a-hint { font-size: 13px; color: var(--ink); }
    .a-hint kbd { font-weight: 700; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; margin-right: 2px; }
    .a-side { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .a-chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 12px; border-radius: 999px; font-size: 16px; background: var(--blue-bg); color: var(--blue); }
    .a-chip.bad { background: var(--red-bg); color: var(--red); }
    .a-quote { flex-basis: 100%; font-size: 16px; font-style: italic; color: var(--ink); background: var(--surface); border-left: 4px solid var(--yellow); padding: 6px 12px; border-radius: 4px; }
    .a-chip span { font-size: 12px; opacity: .8; }
    .q-key.chosen { outline: 3px solid var(--strong, #111); outline-offset: -1px; font-weight: 700; }
    .q-result { padding: 8px 14px; border-radius: 8px; font-size: 18px; font-weight: 700; }
    .q-result.ok { background: var(--green-bg); color: var(--green); }
    .q-result.bad { background: var(--red-bg); color: var(--red); }
    .q-result.set { background: var(--blue-bg); color: var(--blue); }
  </style>
</head>
<body>
  <header class="top">
    <nav class="tabs" data-nav aria-label="Các trang gán nhãn"></nav>
    <label class="small">Hàng đợi <select id="mode"></select></label>
    <span class="grow"></span>
    <label class="small"><input type="checkbox" id="byPlace" checked> Xếp theo vị trí</label>
    <label class="small"><input type="checkbox" id="bigOnly"> Chỉ crop lớn (≥160 px)</label>
  </header>
  <main class="q-wrap">
    <section class="q-stage">
      <div class="q-info"><strong id="pid">…</strong><span class="muted" id="count"></span><span class="muted" id="msg" role="status"></span></div>
      <div class="q-result" id="result" role="status" hidden></div>
      <div class="a-card" id="card" aria-live="polite"></div>
      <canvas id="view" width="960" height="720" aria-label="Ảnh người cần gán, cắt rộng quanh box"></canvas>
    </section>
    <aside class="q-keys" id="keys" aria-label="Phím gán tên"></aside>
  </main>
  <script src="session.js"></script>
  <script src="quickcore.js"></script>
  <script src="action.js"></script>
</body>
</html>
