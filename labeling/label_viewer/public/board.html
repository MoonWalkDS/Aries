<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng định danh</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <header class="top">
    <nav class="tabs" data-nav aria-label="Các trang gán nhãn"></nav>
    <span class="muted small" id="hint">Bấm chọn crop (Shift: chọn một dải), kéo vào tên bên trái. Crop đã gán rời khỏi cụm. Nhấp đúp: mở ảnh gốc.</span>
    <span class="grow"></span>
    <button id="undo" class="ghost" title="Hoàn tác (Z)">Hoàn tác</button>
  </header>
  <main class="b-work">
    <aside class="b-side">
      <input id="filter" type="search" placeholder="Lọc tên / cụm…" aria-label="Lọc tên hoặc cụm">
      <div class="b-sec">Tên <span class="muted">· thả crop vào đây</span></div>
      <div id="names"></div>
      <div class="b-sec">Cụm theo trang phục <span class="muted">· còn chưa gán</span></div>
      <label class="toggle small"><input id="showDone" type="checkbox"> Hiện cả cụm đã gán xong</label>
      <div id="clusters"></div>
    </aside>
    <section class="b-main">
      <div class="b-bar">
        <h2 id="viewTitle">Chọn một tên hoặc một cụm</h2>
        <button id="renameBtn" class="ghost" hidden title="Đổi tên người này ở mọi nơi">Đổi tên</button>
        <span id="viewInfo" class="muted small"></span>
        <span class="grow"></span>
        <label class="toggle small" title="Trong một cụm: ẩn crop viền vàng (tên do mô hình đoán, chưa ai xác nhận)"><input id="hideModel" type="checkbox"> Ẩn crop máy đã đoán</label>
        <label class="toggle small"><input id="bigOnly" type="checkbox"> Chỉ crop lớn (≥160 px)</label>
        <button id="selAll" class="ghost">Chọn tất cả</button>
        <button id="selNone" class="ghost">Bỏ chọn</button>
        <span id="selCount" class="count" hidden></span>
      </div>
      <div id="grid" class="b-grid" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="nameDlg" class="b-dlg">
    <form method="dialog">
      <h2 id="nameDlgTitle">Tên người</h2>
      <p id="nameDlgNote" class="muted small"></p>
      <input id="nameDlgInput" type="text" maxlength="60" list="nameDlgList" autocomplete="off" aria-label="Tên người" required>
      <datalist id="nameDlgList"></datalist>
      <div class="b-dlg-btns">
        <button value="cancel" class="btn" formnovalidate>Huỷ</button>
        <button value="ok" class="btn primary">Lưu</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="session.js"></script>
  <script src="board.js"></script>
</body>
</html>
