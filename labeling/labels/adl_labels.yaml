# Bộ nhãn hoạt động (ADL) cho Castle5000, dùng bởi `python main.py adl ...`.
#
# Quy trình theo LSC-ADL (arXiv:2504.02060, mục 3.2 và Phụ lục A): mỗi lớp có 7 câu mô tả, mỗi câu
# là một truy vấn text->ảnh để lấy ảnh hạt giống. Bộ nhãn của bài báo viết cho lifelog góc nhìn thứ
# nhất của một người; ở đây đã chọn lại cho camera cố định nhìn từ trên xuống một gian bếp có nhiều
# người, nên câu mô tả viết ở góc nhìn thứ ba.
#
# Đây là bản khởi đầu, soạn từ việc xem mẫu ảnh. Sửa tự do: thêm/bớt lớp, viết lại câu mô tả, rồi
# chạy `adl init --force`. Câu mô tả viết bằng tiếng Anh vì CLIP được huấn luyện chủ yếu trên tiếng Anh.
# `name_vi` đi vào bm25_blob để khớp câu truy vấn tiếng Việt.

classes:
