# Hành động của TỪNG NGƯỜI, dùng với `python main.py adl ... --profile people`.
#
# Đơn vị gán nhãn là crop của một người (do `enrich build` cắt), không phải cả khung hình. Nhờ vậy
# một ảnh có năm người làm năm việc sẽ có năm nhãn. Câu mô tả viết cho một crop: một người, nhìn
# chếch từ trên xuống, có thể thấy một phần đồ vật họ đang dùng.
#
# Bản khởi đầu soạn tay. Sửa tự do rồi chạy `adl init --profile people --force`.

classes:
  - name: opening the refrigerator
    name_vi: mở tủ lạnh
    group: Food & Beverage
    descriptions:
      - A person pulling open a large black refrigerator door.
      - A person standing next to an open fridge door and looking inside.
      - Someone reaching into a refrigerator with one arm.
      - A person holding a fridge door open with one hand.
      - A person taking a bottle out of an open refrigerator.
      - A person with an arm stretched out towards a fridge door handle.
      - A person half hidden behind an open black fridge door.

