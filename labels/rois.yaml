# Các vùng cố định của bếp Castle (camera không di chuyển), dùng bởi `python main.py enrich ...`.
#
# Toạ độ là tỉ lệ 0..1 của khung hình: [x1, y1, x2, y2], góc trên-trái -> góc dưới-phải.
#   box  : vùng chứa đồ vật cần soi. Được cắt ở độ phân giải gốc và mã hoá riêng mỗi khi nó thay đổi.
#   zone : chỗ thân người thường xuất hiện khi dùng vùng đó. Người có box đè lên zone nhiều nhất được
#          coi là "đang ở" vùng này. Các zone chồng lấn nhau là bình thường.
#   states: các trạng thái của vùng, mỗi trạng thái có vài câu mô tả tiếng Anh (truy vấn text->ảnh trên
#          crop của vùng), y như lớp ADL. Trạng thái đầu tiên nên là trạng thái bình thường.
#
# Toạ độ đo bằng mắt trên ảnh 10_431 và 13_1476. Sửa tự do rồi chạy lại `enrich build --force`.

rois:
  - name: stove
    name_vi: bếp nấu và lò nướng
    box: [0.56, 0.17, 0.71, 0.52]
    zone: [0.54, 0.08, 0.72, 0.54]
    states:
      - name: stove idle
        name_vi: bếp không dùng
        descriptions:
          - A black kitchen range cooker with nothing on the hob and the oven doors closed.
          - An empty stove top with no pots or pans.
          - A clean black oven with closed doors and nobody near it.
      - name: pots on the stove
        name_vi: có nồi chảo trên bếp
        descriptions:
          - A large metal pot standing on the stove top.
          - A frying pan and a saucepan on the hob of a black range cooker.
          - Cookware on the burners of a kitchen stove with nobody standing there.
      - name: person at the stove
        name_vi: có người đứng ở bếp
        descriptions:
          - A person standing in front of the stove and cooking.
          - The back of a person who is blocking the view of the oven.
          - Someone stirring a pot on the kitchen range.
      # Đã bỏ lớp "oven door open" ngày 2026-11-13: soát 44 nhãn VLM đều sai (cửa lò đóng, người đứng che).
      # Cửa lò hiếm khi mở trong bộ ảnh; 44 crop đó giờ chưa có nhãn, chờ VLM gán lại.

  - name: oven_towel
    name_vi: khăn treo ở cửa lò và tủ bên phải
    box: [0.66, 0.30, 0.76, 0.48]
    zone: [0.62, 0.20, 0.80, 0.56]
    states:
      - name: towel hanging
        name_vi: có khăn treo
        descriptions:
          - A red and white checked tea towel hanging on a white cabinet handle.
          - A dish towel hanging next to a black oven.
          - A kitchen cloth draped over a cupboard door handle.
      - name: no towel
        name_vi: không có khăn
        descriptions:
          - A white kitchen cabinet door with a bare handle and no towel.
          - The side of a black oven and a white cupboard with nothing hanging on it.
          - An empty cabinet handle next to a cooker.
      - name: person in front
        name_vi: bị người che
        descriptions:
          - A person standing in front of a kitchen cabinet and hiding it.
          - Part of a person's body filling the picture.
          - Someone's legs and torso in front of a white cupboard.

  - name: counter_left
    name_vi: mặt bàn bếp bên trái bếp nấu
    box: [0.46, 0.13, 0.59, 0.30]
    zone: [0.42, 0.04, 0.60, 0.40]
    states:
      - name: counter cluttered
        name_vi: mặt bàn bày nhiều đồ
        descriptions:
          - A kitchen counter with a kettle, bread, jars and packets against a red tiled wall.
          - A cluttered worktop with groceries and small appliances.
          - A kitchen counter with a tea towel hanging in front and food items on top.
      - name: person at the counter
        name_vi: có người đứng ở mặt bàn
        descriptions:
          - A person standing at the kitchen counter with their back to the camera.
          - Someone using the kettle on the worktop.
          - A person preparing something at the counter next to the stove.
      - name: counter cleared
        name_vi: mặt bàn đã dọn
        descriptions:
          - A mostly empty kitchen counter against a red tiled wall.
          - A tidy worktop with only a kettle on it.
          - A clean and clear kitchen counter.

  - name: sink
    name_vi: bồn rửa trên đảo bếp
    box: [0.43, 0.33, 0.59, 0.52]
    zone: [0.40, 0.14, 0.62, 0.60]
    states:
      - name: sink empty
        name_vi: bồn rửa trống
        descriptions:
          - An empty stainless steel kitchen sink with a tap and a bottle of dish soap.
          - A clean sink in a black worktop with nothing in it.
          - A kitchen sink with a dish rack and no dishes.
      - name: dishes in the sink
        name_vi: có bát đĩa ở bồn rửa
        descriptions:
          - Dirty plates and bowls piled in and around a kitchen sink.
          - A sink full of pots and dishes waiting to be washed.
          - Plates, a colander and cups next to the kitchen tap.
      - name: person at the sink
        name_vi: có người ở bồn rửa
        descriptions:
          - A person washing dishes at the kitchen sink.
          - Hands holding a plate under the running tap.
          - Someone leaning over the sink and scrubbing a pan.

  - name: island
    name_vi: mặt đảo bếp
    box: [0.24, 0.26, 0.47, 0.50]
    zone: [0.18, 0.08, 0.50, 0.62]
    states:
      - name: island with fruit only
        name_vi: đảo bếp chỉ có trái cây
        descriptions:
          - A black kitchen island with a bowl of fruit, a pineapple and orange place mats.
          - A tidy kitchen island with bananas and oranges and no plates.
          - A dark countertop with a fruit bowl and a cutting board, nobody around.
      - name: food being prepared
        name_vi: đang bày đồ sơ chế
        descriptions:
          - A kitchen island covered with chopped vegetables, cutting boards and bowls of ingredients.
          - Raw ingredients and knives spread over a black worktop.
          - A person chopping food on a red cutting board at the island.
      - name: meal served
        name_vi: đã bày món ăn
        descriptions:
          - A kitchen island set with plates of cooked food and serving dishes.
          - Many dishes of food laid out on a black countertop for a meal.
          - Plates, bowls and glasses arranged on the island for people to eat.
      - name: people around the island
        name_vi: nhiều người quanh đảo bếp
        descriptions:
          - Several people crowding around a kitchen island.
          - People leaning over a countertop and hiding it from view.
          - A group standing close together at the kitchen island.

  - name: trash
    name_vi: thùng rác
    box: [0.50, 0.50, 0.63, 0.77]
    zone: [0.46, 0.36, 0.68, 0.84]
    # Hai thùng không có nắp nên "đóng/mở" không nhìn ra được. Đổi ngày 2026-11-13 sang có rác / không có rác.
    # Nhãn cũ đã đổi tên tại chỗ: "bin open" -> "trash in the bins", "bins closed" -> "bins empty" (chưa ai soát).
    states:
      - name: bins empty
        name_vi: thùng không có rác
        descriptions:
          - Two empty black rubbish bins with nothing inside, standing on a tiled floor.
          - Clean empty trash cans with only a bare bin bag inside.
          - Kitchen waste bins with no rubbish in them and nobody near them.
      - name: trash in the bins
        name_vi: thùng có rác
        descriptions:
          - Black rubbish bins with plastic bags, paper and food waste visible inside.
          - A trash can filled with rubbish.
          - Kitchen bins with waste and packaging piled inside.
      - name: person at the bins
        name_vi: có người ở thùng rác
        descriptions:
          - A person standing in front of the rubbish bins.
          - Someone bending down to throw something into a trash can.
          - A person's legs next to a black kitchen bin.

  - name: fridge
    name_vi: tủ lạnh
    # Tủ lạnh đứng sát mép phải, gần như khuất khi đóng; khi mở, cửa đen (hiệu Samsung, có tờ giấy vàng)
    # xoay sang trái và chiếm x 0.50..0.78. Khung phủ cả vùng cửa xoay và người đứng sau cửa.
    # Sửa ngày 2026-11-12 trên ảnh 08_3282, 12_788, 16_2014 (mở) và 08_1239 (đóng).
    box: [0.48, 0.32, 0.84, 1.00]
    zone: [0.44, 0.24, 0.88, 1.00]
    # Ghép vào prompt của VLM (adl vlm-review). Không có câu này VLM chờ thấy tủ lạnh và chọn "cannot tell"
    # cho mọi ảnh tủ đóng (tủ khuất) và cả ảnh có người đi qua.
    # Bản đầu của câu này đặt "fridge closed" trước: Qwen chọn "closed" cả khi có người đi qua. Giữ thứ tự:
    # cửa mở -> có người -> trống.
    vlm_hint: >-
      The fridge stands just outside the right edge of this crop and is hidden when closed. Decide in this order.
      First: if a large black fridge door with a yellow notice fills much of the crop, the answer is "fridge open".
      Second: otherwise, if ANY person (a body, legs or a head) is visible anywhere in the crop, the answer is
      "person passing". Third: only if there is no open door and no person at all (just the tiled floor, a red
      mat, black bins and white cabinets), the answer is "fridge closed".
    states:
      - name: fridge closed
        name_vi: tủ lạnh đóng
        descriptions:
          - A tiled kitchen floor in front of white kitchen cabinets, with no fridge door in view.
          - An empty kitchen floor with a red mat and the thin black edge of a closed fridge.
          - White cupboards and a clear tiled floor, nothing blocking the view.
      - name: fridge open
        name_vi: tủ lạnh mở
        descriptions:
          - A large black Samsung refrigerator door swung open with a yellow notice stuck on it.
          - An open black fridge door covering most of the kitchen floor.
          - A person standing behind an open black fridge door and looking inside.
      - name: person passing
        name_vi: có người đi qua
        descriptions:
          - A person walking across a tiled kitchen floor.
          - Someone standing on a red floor mat.
          - A person seen from above walking past a white wall.

  - name: coffee_corner
    name_vi: góc pha cà phê
    box: [0.04, 0.42, 0.23, 0.76]
    zone: [0.00, 0.30, 0.28, 0.90]
    states:
      - name: coffee corner idle
        name_vi: góc cà phê không ai dùng
        descriptions:
          - A coffee machine, mugs and boxes on a low black counter.
          - A small side counter with a coffee maker and a tray of cups, nobody there.
          - A cluttered coffee station seen from above.
      - name: person at the coffee corner
        name_vi: có người ở góc cà phê
        descriptions:
          - A person making coffee at a coffee machine.
          - Someone standing at a low counter and reaching for a mug.
          - A person bending over a coffee station.

  - name: living_area
    name_vi: khu ghế sofa cạnh cửa sổ
    # Sửa ngày 2026-11-13: khung cũ [0.08, 0.10, 0.34, 0.40] lấn sang mặt đảo bếp nên VLM gán "có người ở
    # khu sofa" cho người đứng ở đảo. Khung mới dừng ở mép đảo (x 0.25), vẫn gồm cửa sổ và cả ghế sofa.
    box: [0.08, 0.10, 0.25, 0.38]
    zone: [0.06, 0.06, 0.34, 0.44]
    states:
      - name: living area empty
        name_vi: khu sofa không có người
        descriptions:
          - A red tartan sofa by a bright window with nobody sitting on it.
          - An empty sitting area with a red checked couch and a fireplace.
          - A window with curtains and an unoccupied sofa.
      - name: people in the living area
        name_vi: có người ở khu sofa
        descriptions:
          - People sitting on a red tartan sofa.
          - A person standing near a window in the sitting area.
          - Someone using a laptop on a shelf next to a fireplace.

  - name: floor_front
    name_vi: sàn và bàn thấp phía trước
    box: [0.18, 0.80, 0.50, 1.00]
    zone: [0.10, 0.60, 0.56, 1.00]
    states:
      - name: front counter with toaster
        name_vi: bàn thấp chỉ có máy nướng bánh
        descriptions:
          - A toaster on a low black counter seen from directly above.
          - A tiled floor and a silver toaster with nothing else.
          - An empty corner of a counter with a toaster.
      - name: food on the front counter
        name_vi: có đồ ăn trên bàn thấp
        descriptions:
          - A bowl of orange food and a foil tray on a low counter.
          - Dishes of food placed next to a toaster.
          - A large aluminium tray and a bowl of noodles seen from above.
      - name: person in the foreground
        name_vi: có người đứng phía trước
        descriptions:
          - The head and shoulders of a person seen from directly above.
          - A person standing close below the camera.
          - Someone walking through the bottom of the picture.
